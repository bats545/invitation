<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Приглашение на 30-летие</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #0a0a1a;
        }

        .invitation-card {
            max-width: 700px;
            width: 100%;
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .invitation-card:hover {
            transform: translateY(-5px);
        }

        .invitation-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Текст поверх картинки */
        .invitation-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 40px 24px 120px 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 100%);
        }

        .top-message {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .guest-name {
            font-size: 38px;
            font-weight: 700;
            margin: 15px 0;
            color: #f5e7a3;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
        }

        .bottom-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 20px;
        }

        .invite-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: left;
            flex: 1;
            padding-left: 8px;
            color: white;
            line-height: 1.2;
        }

        .age {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            font-weight: 900;
            color: #f5e7a3;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
            text-align: right;
            flex: 1;
            padding-right: 8px;
            line-height: 1;
        }

        .bottom-info {
            width: 100%;
            text-align: center;
        }

        .bottom-info .date {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.55);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
        }

        .bottom-info .address {
            font-size: 16px;
            font-weight: 400;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.55);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            line-height: 1.4;
        }

        /* Кнопки */
        .overlay-buttons {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .btn {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(245, 231, 163, 0.6);
            padding: 12px 28px;
            border-radius: 60px;
            color: #f5e7a3;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #f5e7a3;
            color: #1a1a1a;
            border-color: #f5e7a3;
            transform: translateY(-3px);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            max-width: 550px;
            width: 90%;
            background: linear-gradient(135deg, #fff 0%, #fef9f0 100%);
            border-radius: 40px;
            padding: 30px 25px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(245,231,163,0.5);
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 32px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #d4af37;
            transform: scale(1.1);
        }

        .question {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #2c2c2c;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            background: #f5f3f0;
            padding: 10px 22px;
            border-radius: 60px;
            cursor: pointer;
            border: 1px solid #e0d8cc;
            transition: all 0.3s ease;
            font-size: 15px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
        }

        .option.selected {
            background: #d4af37;
            color: white;
            border-color: #d4af37;
            box-shadow: 0 4px 12px rgba(212,175,55,0.3);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e0d8cc;
            border-radius: 60px;
            margin-bottom: 20px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            background: white;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
        }

        .selected-list {
            background: linear-gradient(135deg, #f9f5f0, #f5f0e8);
            padding: 14px;
            border-radius: 60px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
            font-family: 'Cormorant Garamond', serif;
            border: 1px solid #e8dfd0;
            color: #333;
        }

        .selected-list span {
            font-weight: bold;
            color: #d4af37;
        }

        .submit-btn {
            background: linear-gradient(135deg, #d4af37 0%, #c5a128 100%);
            color: #1a1a1a;
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-family: 'Cormorant Garamond', serif;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212,175,55,0.4);
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 60px;
            text-align: center;
            font-size: 14px;
        }

        .success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .loading { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }

        /* ========== АДАПТИВ ДЛЯ ТЕЛЕФОНОВ ========== */
        /* Для телефонов — на весь экран */
        @media (max-width: 600px) {
            body {
                padding: 0;
                margin: 0;
            }
    
            .invitation-card {
                max-width: 100%;
                width: 100%;
                border-radius: 0;
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
    
            .invitation-image {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
    
            .invitation-text {
                padding: 20px 16px 100px 16px;
            }
    
            .guest-name {
                font-size: 28px;
                margin-top: 0;
            }
    
            .invite-text {
                font-size: 22px;
            }
    
            .age {
                font-size: 44px;
            }
    
            .bottom-info {
                margin-bottom: 20px;
            }
    
            .overlay-buttons {
                bottom: 20px;
                gap: 12px;
            }
    
            .btn {
                padding: 10px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="invitation-card">
    <img class="invitation-image" src="https://i.postimg.cc/prxZtCb9/DSC08327.jpg" alt="Приглашение">
    
    <div class="invitation-text">
        <div class="top-message">
            <div class="guest-name" id="guestNameDisplay"></div>
            <div class="bottom-row">
                <div class="invite-text" id="inviteText">Приглашаю на мои</div>
                <div class="age">30 ЛЕТ!</div>
            </div>
        </div>
        
        <div class="bottom-info">
            <div class="date" id="eventDate">📅 15 августа 2026 <br> Суббота | 16:00</div>
            <div class="address" id="eventAddress">📍 ул. Братская, 1А, г. Димитровград <br> ресторан "Венеция"</div>
        </div>
    </div>
    
    <div class="overlay-buttons">
        <button class="btn" onclick="openPoll()">🍾 Выбери напитки</button>
        <button class="btn" onclick="window.open('https://yandex.ru/maps/11155/dimitrovgrad/house/bratskaya_ulitsa_1a/YEAYcw9gTUEBQFtufX5ydn1lZw==/?ll=49.580801%2C54.236968&z=19.6', '_blank')">📍 Место встречи</button>
    </div>
</div>

<div id="pollModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePoll()">&times;</span>
        <div class="question">🥂 Что будете пить?<br><span style="font-size: 14px; color: #888;">можно выбрать несколько</span></div>
        <div class="options" id="drinkOptions"></div>
        <input type="text" id="otherDrink" placeholder="✏️ Или напишите свой вариант...">
        <div class="selected-list" id="selectedList">✨ Выбрано: <span>пока ничего</span> ✨</div>
        <button class="submit-btn" id="submitBtn">✅ ОТПРАВИТЬ ОТВЕТ</button>
        <div id="responseMessage"></div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ ТЕКСТА (МЕНЯЙ ЗДЕСЬ) ==========
    const INVITE_TEXT = "Приглашаю на мои";
    const EVENT_DATE = "📅 15 августа 2026 <br> Суббота | 16:00";
    const EVENT_ADDRESS = "📍 ул. Братская, 1А, г. Димитровград <br> ресторан \"Венеция\"";
    const FORMSPREE_ID = "xzdkvkkw";
    // ===================================================
    
    document.getElementById('inviteText').innerHTML = INVITE_TEXT;
    document.getElementById('eventDate').innerHTML = EVENT_DATE;
    document.getElementById('eventAddress').innerHTML = EVENT_ADDRESS;
    
    const urlParams = new URLSearchParams(window.location.search);
    let guestName = urlParams.get('guest');
    if (!guestName) guestName = 'Гость';
    document.getElementById('guestNameDisplay').innerHTML = `${guestName}!`;
    
    const drinks = [
        '🍷 Вино красное',
        '🥂 Вино белое', 
        '🍾 Шампанское',
        '🥃 Коньяк',
        '🍸 Водка',
        '🥴 Самогон',
        '🧃 Не пью алкоголь'
    ];
    
    let selectedDrinks = new Set();
    
    function updateSelectedDisplay() {
        const span = document.querySelector('#selectedList span');
        if (selectedDrinks.size === 0) {
            span.textContent = 'пока ничего';
        } else {
            span.textContent = Array.from(selectedDrinks).join(', ');
        }
    }
    
    const drinkContainer = document.getElementById('drinkOptions');
    drinkContainer.innerHTML = '';
    
    drinks.forEach(drink => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.textContent = drink;
        
        btn.onclick = () => {
            const isNoAlcohol = drink === '🧃 Не пью алкоголь';
            
            if (isNoAlcohol) {
                if (selectedDrinks.has(drink)) {
                    selectedDrinks.clear();
                    document.querySelectorAll('#drinkOptions .option').forEach(b => b.classList.remove('selected'));
                } else {
                    selectedDrinks.clear();
                    selectedDrinks.add(drink);
                    document.querySelectorAll('#drinkOptions .option').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                }
            } else {
                if (selectedDrinks.has(drink)) {
                    selectedDrinks.delete(drink);
                    btn.classList.remove('selected');
                } else {
                    if (selectedDrinks.has('🧃 Не пью алкоголь')) {
                        selectedDrinks.delete('🧃 Не пью алкоголь');
                        document.querySelectorAll('#drinkOptions .option').forEach(b => {
                            if (b.textContent === '🧃 Не пью алкоголь') b.classList.remove('selected');
                        });
                    }
                    selectedDrinks.add(drink);
                    btn.classList.add('selected');
                }
            }
            updateSelectedDisplay();
        };
        drinkContainer.appendChild(btn);
    });
    
    document.getElementById('otherDrink').addEventListener('change', function() {
        const val = this.value.trim();
        if (val) {
            if (selectedDrinks.has('🧃 Не пью алкоголь')) {
                selectedDrinks.delete('🧃 Не пью алкоголь');
                document.querySelectorAll('#drinkOptions .option').forEach(b => {
                    if (b.textContent === '🧃 Не пью алкоголь') b.classList.remove('selected');
                });
            }
            selectedDrinks.add(val);
            updateSelectedDisplay();
            this.value = '';
        }
    });
    
    function openPoll() {
        document.getElementById('pollModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    
    function closePoll() {
        document.getElementById('pollModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
    
    const submitBtn = document.getElementById('submitBtn');
    const msgDiv = document.getElementById('responseMessage');
    
    submitBtn.onclick = async () => {
        if (selectedDrinks.size === 0) {
            msgDiv.innerHTML = '<div class="message error">❌ Пожалуйста, выберите хотя бы один напиток!</div>';
            return;
        }
        
        const finalDrinks = Array.from(selectedDrinks).join(', ');
        msgDiv.innerHTML = '<div class="message loading">⏳ Отправка...</div>';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    guest: guestName,
                    drink: finalDrinks
                })
            });
            
            if (response.ok) {
                msgDiv.innerHTML = `<div class="message success">🎉 Спасибо, ${guestName}! Ваш ответ отправлен. Жду в гости! 🎂</div>`;
                setTimeout(() => { closePoll(); }, 2000);
            } else {
                throw new Error('Ошибка отправки');
            }
        } catch (error) {
            msgDiv.innerHTML = '<div class="message error">❌ Ошибка отправки. Попробуйте еще раз.</div>';
            submitBtn.disabled = false;
        }
    };
    
    window.onclick = function(event) {
        const modal = document.getElementById('pollModal');
        if (event.target === modal) closePoll();
    }
</script>
</body>
</html>
