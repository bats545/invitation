<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на 30-летие</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0a1a;
        }

        .invitation-card {
            max-width: 800px;
            width: 100%;
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .invitation-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .invitation-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            color: rgb(0, 0, 0);
            padding: 40px 20px 100px 20px;
        }

        .top-message {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .guest-name {
            font-size: 36px;
            font-weight: 700;
            margin: 10px 0;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            height: 10px;
            width: 100%;
        }

        .bottom-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .invite-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: left;
            flex: 1;
            height: 100px;
            padding-left: 5px;
        }

        .age {
            font-family: 'Cormorant Garamond', serif;
            font-size: 68px;
            font-weight: 900;
            color: #000000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: right;
            flex: 1;
            height: 10px;
            padding-right: 20px;
        }

        .bottom-info {
            width: 100%;
        }

        .bottom-info .date {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .bottom-info .address {
            font-size: 18px;
            font-weight: 400;
            opacity: 0.95;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        .overlay-buttons {
            position: absolute;
            bottom: 8%;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .btn {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 14px 32px;
            border-radius: 50px;
            color: #f8d04e;
            font-family: 'Raleway', sans-serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #d4af37;
            color: #1a1a1a;
            border-color: #d4af37;
            transform: translateY(-3px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 600px;
            width: 90%;
            background: white;
            border-radius: 30px;
            padding: 30px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #d4af37;
        }

        .question {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            background: #f5f3f0;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid #e0d8cc;
            transition: all 0.3s ease;
            font-size: 14px;
            font-family: 'Cormorant Garamond', serif;
        }

        .option.selected {
            background: #d4af37;
            color: white;
            border-color: #d4af37;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0d8cc;
            border-radius: 50px;
            margin-bottom: 15px;
            font-family: 'Cormorant Garamond', serif;
        }

        .selected-list {
            background: #f9f5f0;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-family: 'Cormorant Garamond', serif;
        }

        .submit-btn {
            background: linear-gradient(135deg, #d4af37 0%, #c5a128 100%);
            color: #1a1a1a;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-family: 'Cormorant Garamond', serif;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-size: 14px;
        }

        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }

        @media (max-width: 600px) {
            .btn { padding: 10px 18px; font-size: 12px; }
            .overlay-buttons { gap: 12px; bottom: 5%; }
            .invitation-text { padding: 20px 15px 90px 15px; }
            .guest-name { font-size: 24px; }
            .invite-text { font-size: 20px; }
            .age { font-size: 36px; }
            .bottom-info .date { font-size: 14px; }
            .bottom-info .address { font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="invitation-card">
    <img class="invitation-image" src="https://i.postimg.cc/m21F9dtD/DSC08327.jpg" alt="Приглашение">
    
    <div class="invitation-text">
        <div class="top-message">
            <div class="guest-name" id="guestNameDisplay"></div>
            <div class="bottom-row">
                <div class="invite-text" id="inviteText">Приглашаю на мои</div>
                <div class="age">30 ЛЕТ!</div>
            </div>
        </div>
        
        <div class="bottom-info">
            <div class="date" id="eventDate">📅 15 августа 2026 <br> Суббота | 16:00</div>
            <div class="address" id="eventAddress">📍 ул. Братская, 1А, г. Димитровград <br> ресторан "Венеция"</div>
        </div>
    </div>
    
    <div class="overlay-buttons">
        <button class="btn" onclick="openPoll()">🍾 Выбери напитки</button>
        <button class="btn" onclick="window.open('https://yandex.ru/maps/11155/dimitrovgrad/house/bratskaya_ulitsa_1a/YEAYcw9gTUEBQFtufX5ydn1lZw==/?ll=49.580801%2C54.236968&z=19.6', '_blank')">📍 Место встречи</button>
    </div>
</div>

<div id="pollModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePoll()">&times;</span>
        <div class="question">🥂 Что будете пить?<br><span style="font-size: 14px; color: #888;">можно выбрать несколько</span></div>
        <div class="options" id="drinkOptions"></div>
        <input type="text" id="otherDrink" placeholder="✏️ Или напишите свой вариант...">
        <div class="selected-list" id="selectedList">✨ Выбрано: <span>пока ничего</span> ✨</div>
        <button class="submit-btn" id="submitBtn">✅ ОТПРАВИТЬ ОТВЕТ</button>
        <div id="responseMessage"></div>
    </div>
</div>

<script>
    // ========== НАСТРОЙКИ ТЕКСТА (МЕНЯЙ ЗДЕСЬ) ==========
    const INVITE_TEXT = "Приглашаю на мои";
    const EVENT_DATE = "📅 15 августа 2026 <br> Суббота | 16:00";
    const EVENT_ADDRESS = "📍 ул. Братская, 1А, г. Димитровград <br> ресторан \"Венеция\"";
    // ===================================================
    
    const FORMSPREE_ID = "xzdkvkkw";
    
    document.getElementById('inviteText').innerHTML = INVITE_TEXT;
    document.getElementById('eventDate').innerHTML = EVENT_DATE;
    document.getElementById('eventAddress').innerHTML = EVENT_ADDRESS;
    
    const urlParams = new URLSearchParams(window.location.search);
    let guestName = urlParams.get('guest');
    if (!guestName) guestName = 'Гость';
    document.getElementById('guestNameDisplay').innerHTML = `${guestName}!`;
    
    // Список напитков (с эмодзи)
    const drinks = [
        '🍷 Вино красное',
        '🥂 Вино белое', 
        '🍾 Шампанское',
        '🥃 Коньяк',
        '🍸 Водка',
        '🥴 Самогон',
        '🧃 Не пью алкоголь'
    ];
    
    // Храним выбранные напитки (включая эмодзи для отображения)
    let selectedDrinks = new Set();
    
    function updateSelectedDisplay() {
        const span = document.querySelector('#selectedList span');
        if (selectedDrinks.size === 0) {
            span.textContent = 'пока ничего';
        } else {
            // Показываем с эмодзи
            span.textContent = Array.from(selectedDrinks).join(', ');
        }
    }
    
    const drinkContainer = document.getElementById('drinkOptions');
    drinkContainer.innerHTML = '';
    
    drinks.forEach(drink => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.textContent = drink;
        
        btn.onclick = () => {
            const isNoAlcohol = drink === '🧃 Не пью алкоголь';
            
            if (isNoAlcohol) {
                // Если выбрали "Не пью алкоголь"
                if (selectedDrinks.has(drink)) {
                    // Уже выбрано — снимаем
                    selectedDrinks.clear();
                    document.querySelectorAll('#drinkOptions .option').forEach(b => b.classList.remove('selected'));
                } else {
                    // Выбираем "Не пью" и очищаем всё
                    selectedDrinks.clear();
                    selectedDrinks.add(drink);
                    document.querySelectorAll('#drinkOptions .option').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                }
            } else {
                // Выбрали алкоголь
                if (selectedDrinks.has(drink)) {
                    // Убираем этот напиток
                    selectedDrinks.delete(drink);
                    btn.classList.remove('selected');
                } else {
                    // Добавляем напиток
                    // Если был выбран "Не пью алкоголь" — убираем его
                    if (selectedDrinks.has('🧃 Не пью алкоголь')) {
                        selectedDrinks.delete('🧃 Не пью алкоголь');
                        document.querySelectorAll('#drinkOptions .option').forEach(b => {
                            if (b.textContent === '🧃 Не пью алкоголь') {
                                b.classList.remove('selected');
                            }
                        });
                    }
                    selectedDrinks.add(drink);
                    btn.classList.add('selected');
                }
            }
            updateSelectedDisplay();
        };
        drinkContainer.appendChild(btn);
    });
    
    // Обработка своего варианта напитка
    document.getElementById('otherDrink').addEventListener('change', function() {
        const val = this.value.trim();
        if (val) {
            // Если был выбран "Не пью алкоголь" — убираем его
            if (selectedDrinks.has('🧃 Не пью алкоголь')) {
                selectedDrinks.delete('🧃 Не пью алкоголь');
                document.querySelectorAll('#drinkOptions .option').forEach(b => {
                    if (b.textContent === '🧃 Не пью алкоголь') {
                        b.classList.remove('selected');
                    }
                });
            }
            selectedDrinks.add(val);
            updateSelectedDisplay();
            this.value = '';
        }
    });
    
    function openPoll() {
        document.getElementById('pollModal').style.display = 'flex';
    }
    
    function closePoll() {
        document.getElementById('pollModal').style.display = 'none';
    }
    
    const submitBtn = document.getElementById('submitBtn');
    const msgDiv = document.getElementById('responseMessage');
    
    submitBtn.onclick = async () => {
        if (selectedDrinks.size === 0) {
            msgDiv.innerHTML = '<div class="message error">❌ Пожалуйста, выберите хотя бы один напиток!</div>';
            return;
        }
        
        const finalDrinks = Array.from(selectedDrinks).join(', ');
        msgDiv.innerHTML = '<div class="message loading">⏳ Отправка...</div>';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    guest: guestName,
                    drink: finalDrinks
                })
            });
            
            if (response.ok) {
                msgDiv.innerHTML = `<div class="message success">🎉 Спасибо, ${guestName}! Ваш ответ отправлен. Жду в гости! 🎂</div>`;
                setTimeout(() => { closePoll(); }, 2000);
            } else {
                throw new Error('Ошибка отправки');
            }
        } catch (error) {
            msgDiv.innerHTML = '<div class="message error">❌ Ошибка отправки. Попробуйте еще раз.</div>';
            submitBtn.disabled = false;
        }
    };
    
    window.onclick = function(event) {
        const modal = document.getElementById('pollModal');
        if (event.target === modal) closePoll();
    }
</script>
</body>
</html>
